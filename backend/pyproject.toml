[project]
name = "auren-solian-backend"
version = "1.0.0"
description = "AUREN SOLIAN — Organizational Intelligence & Enterprise AI Platform Backend"
authors = [{ name = "Solian Enterprise Architecture Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
]
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
