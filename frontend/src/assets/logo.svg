      <polygon points="256,130 296,150 382,80" fill="url(#facetDark)" />
      <polygon points="382,80 402,210 326,180" fill="url(#facetLight)" />
      <polygon points="372,110 326,180 382,190" fill="url(#solianGold)" stroke="#F7E7B4" stroke-width="2" />
      <polygon points="256,130 216,180 256,230 296,180" fill="url(#facetAccent)" stroke="url(#solianGold)" stroke-width="4" />
      <polygon points="256,145 228,180 256,215 284,180" fill="none" stroke="#F7E7B4" stroke-width="2" opacity="0.7" />
      <polygon points="256,130 216,150 186,180 216,180" fill="url(#facetLight)" />
      <polygon points="256,130 296,150 326,180 296,180" fill="url(#facetDark)" />
