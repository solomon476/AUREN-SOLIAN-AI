      <polygon points="90,270 120,340 190,310 170,250" fill="url(#facetLight)" />
      <polygon points="422,270 392,340 322,310 342,250" fill="url(#facetDark)" />
      <polygon points="120,340 170,395 210,360 190,310" fill="url(#facetDark)" />
      <polygon points="392,340 342,395 302,360 322,310" fill="url(#facetLight)" />
      <polygon points="256,230 216,180 186,220 220,230" fill="url(#facetDark)" />
      <polygon points="256,230 296,180 326,220 292,230" fill="url(#facetLight)" />
      <polygon points="186,225 230,230 222,248 188,242" fill="url(#goldFoil)" stroke="#FFF4D4" stroke-width="2.5" />
      <polygon points="326,225 282,230 290,248 324,242" fill="url(#goldFoil)" stroke="#FFF4D4" stroke-width="2.5" />
      <polygon points="256,230 220,230 226,300 256,310" fill="url(#facetLight)" />
      <polygon points="256,230 292,230 286,300 256,310" fill="url(#facetDark)" />
      <polygon points="256,310 226,300 236,360 256,370" fill="url(#facetDark)" />
      <polygon points="256,310 286,300 276,360 256,370" fill="url(#facetLight)" />
      <polygon points="220,230 170,250 190,310 226,300" fill="url(#facetDark)" />
      <polygon points="292,230 342,250 322,310 286,300" fill="url(#facetLight)" />
      <polygon points="226,300 190,310 210,360 236,360" fill="url(#facetLight)" />
      <polygon points="286,300 322,310 302,360 276,360" fill="url(#facetDark)" />
      <polygon points="240,370 272,370 256,392" fill="url(#solianGold)" stroke="#FFF4D4" stroke-width="2.5" />
