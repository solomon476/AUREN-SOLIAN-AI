    <linearGradient id="facetAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A4866" />
      <stop offset="100%" stop-color="#1A2232" />
    </linearGradient>
  </defs>

