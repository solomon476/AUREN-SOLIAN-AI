  <!-- Typography: AUREN SOLIAN -->
  <text x="175" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" letter-spacing="4" fill="#FFFFFF">
    AUREN <tspan fill="url(#solianGold)">SOLIAN</tspan>
  </text>
  <text x="178" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" letter-spacing="6" fill="#D4AF37" opacity="0.9">
    ORGANIZATIONAL INTELLIGENCE
  </text>
  <line x1="178" y1="128" x2="520" y2="128" stroke="url(#solianGold)" stroke-width="1.5" stroke-opacity="0.3" />
</svg>